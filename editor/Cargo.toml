[package]
name = "creative-console-editor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
creative-console-daemon = { path = ".." }
eframe = "0.33.3"
egui = "0.33.3"
image = "0.25.10"
rfd = "0.17.2"
toml = "0.8"
tray-icon = "0.24.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
